# Local/full-stack run: Postgres + API + background worker.  `docker compose up --build`
# Development defaults only — set real secrets via an untracked .env for anything shared.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetable_dev}
      POSTGRES_DB: timetable
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment: &backend_env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://timetable:${POSTGRES_PASSWORD:-timetable_dev}@db:5432/timetable
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-0123456789}
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend_env
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
  storage:
