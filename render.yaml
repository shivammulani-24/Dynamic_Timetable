# Render Blueprint — free demo deployment (one web service + one free Postgres database).
# Render: New → Blueprint → pick this repository. You will be asked for DEMO_PASSWORD.
# Free tier: the service sleeps after 15 min idle (first request then takes ~1 min); the free
# database expires 30 days after creation. See docs/12-deploy-free.md.
databases:
  - name: timetable-db
    plan: free
    region: singapore
    databaseName: timetable
    user: timetable

services:
  - type: web
    name: dynamic-timetable
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "[]"
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: INFO
